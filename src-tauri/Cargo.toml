[package]
name = "nexusai"
version = "0.1.0"
description = "NexusAI - The ultimate bridge for AI Skills across editors"
authors = ["XP-Xiao"]
edition = "2021"

[lib]
name = "nexusai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4"
